# PSW-4320: seven immutable staging/homol comparison pairs.
# Each country loads its own runtime credentials from ./secrets/<site>.env.
# Real secret files never belong to the repository or Docker build context.
name: woo-e2e-shared

x-wp: &wp
  build:
    context: ..
    args:
      PHP_VERSION: "${PHP_VERSION:-8.2}"
  environment:
    PORT: 80
    THEME: storefront
    XDEBUG_MODE: "off"
    E2E_SHARED_ENVIRONMENT: 1
  restart: unless-stopped
  networks: [web]
  healthcheck:
    test: ["CMD-SHELL", "curl -fsS http://localhost/ >/dev/null || exit 1"]
    interval: 10s
    timeout: 5s
    retries: 30
    start_period: 180s

services:
  caddy-e2e:
    image: caddy:2
    container_name: caddy-e2e
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile.e2e:/etc/caddy/Caddyfile:ro
      - caddy-e2e-data:/data
      - caddy-e2e-config:/config
    restart: unless-stopped
    networks: [web]

  wp-staging-mla:
    <<: *wp
    container_name: wp-staging-mla
    env_file: ["${E2E_SECRETS_MLA_FILE:-./secrets/mla.env}"]
    environment: {SITE: mla, PORT: 80, THEME: storefront, XDEBUG_MODE: "off", E2E_SHARED_ENVIRONMENT: 1, MP_CUSTOM_DOMAIN: "https://e2e-staging-mla.ppolimpo.io"}
    volumes: [wp-staging-mla-data:/var/www/html, db-staging-mla-data:/var/lib/mysql, ./artifacts/staging:/e2e-artifacts:ro]

  wp-homol-mla:
    <<: *wp
    container_name: wp-homol-mla
    env_file: ["${E2E_SECRETS_MLA_FILE:-./secrets/mla.env}"]
    environment: {SITE: mla, PORT: 80, THEME: storefront, XDEBUG_MODE: "off", E2E_SHARED_ENVIRONMENT: 1, MP_CUSTOM_DOMAIN: "https://e2e-homol-mla.ppolimpo.io"}
    volumes: [wp-homol-mla-data:/var/www/html, db-homol-mla-data:/var/lib/mysql, ./artifacts/homol:/e2e-artifacts:ro]

  wp-staging-mlb:
