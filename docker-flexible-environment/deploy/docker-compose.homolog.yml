# Orquestração de HOMOLOGAÇÃO (roda na instância AWS via deploy.sh).
# NÃO é o ambiente local. Cada país é um container; o Caddy termina TLS
# (Let's Encrypt automático) e roteia <HOMOLOG_PREFIX>-<site>.<base> -> wp-<site>.
#
# HOMOLOG_PREFIX (= usuário de rede do dev) e HOMOLOG_BASE_DOMAIN vêm do deploy.sh.
# Sobe seletivamente por profile:  docker compose --profile mlb --profile mla up -d
name: woo-homolog

x-wp: &wp
  build:
    context: ./woocommerce-mercadopago/docker-flexible-environment
    args:
      PHP_VERSION: "${PHP_VERSION:-7.4}"
  env_file:
    - ./woocommerce-mercadopago/docker-flexible-environment/.env
  restart: unless-stopped
  networks: [web]

services:
  caddy:
    image: caddy:2
    container_name: caddy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped
    networks: [web]

  wp-mlb:
    <<: *wp
    container_name: wp-mlb
    profiles: ["mlb"]
    environment:
      - SITE=mlb
      - PORT=80
      - THEME=storefront
      - MP_CUSTOM_DOMAIN=https://${HOMOLOG_PREFIX:-mp}-mlb.${HOMOLOG_BASE_DOMAIN:-ppolimpo.io}
    volumes:
      - wp-mlb-data:/var/www/html
      - db-mlb-data:/var/lib/mysql
      - ./woocommerce-mercadopago:/woocommerce-mercadopago

  wp-mla:
    <<: *wp
    container_name: wp-mla
    profiles: ["mla"]
    environment:
      - SITE=mla
      - PORT=80
      - THEME=storefront
      - MP_CUSTOM_DOMAIN=https://${HOMOLOG_PREFIX:-mp}-mla.${HOMOLOG_BASE_DOMAIN:-ppolimpo.io}
    volumes:
      - wp-mla-data:/var/www/html
      - db-mla-data:/var/lib/mysql
      - ./woocommerce-mercadopago:/woocommerce-mercadopago

  wp-mlm:
    <<: *wp
    container_name: wp-mlm
    profiles: ["mlm"]
    environment:
      - SITE=mlm
      - PORT=80
      - THEME=storefront
      - MP_CUSTOM_DOMAIN=https://${HOMOLOG_PREFIX:-mp}-mlm.${HOMOLOG_BASE_DOMAIN:-ppolimpo.io}
    volumes:
      - wp-mlm-data:/var/www/html
      - db-mlm-data:/var/lib/mysql
      - ./woocommerce-mercadopago:/woocommerce-mercadopago

  wp-mco:
    <<: *wp
    container_name: wp-mco
    profiles: ["mco"]
    environment:
      - SITE=mco
      - PORT=80
      - THEME=storefront
      - MP_CUSTOM_DOMAIN=https://${HOMOLOG_PREFIX:-mp}-mco.${HOMOLOG_BASE_DOMAIN:-ppolimpo.io}
    volumes:
      - wp-mco-data:/var/www/html
      - db-mco-data:/var/lib/mysql
      - ./woocommerce-mercadopago:/woocommerce-mercadopago

  wp-mlc:
    <<: *wp
    container_name: wp-mlc
    profiles: ["mlc"]
    environment:
      - SITE=mlc
      - PORT=80
      - THEME=storefront
      - MP_CUSTOM_DOMAIN=https://${HOMOLOG_PREFIX:-mp}-mlc.${HOMOLOG_BASE_DOMAIN:-ppolimpo.io}
    volumes:
      - wp-mlc-data:/var/www/html
      - db-mlc-data:/var/lib/mysql
      - ./woocommerce-mercadopago:/woocommerce-mercadopago

  wp-mlu:
    <<: *wp
    container_name: wp-mlu
    profiles: ["mlu"]
    environment:
      - SITE=mlu
      - PORT=80
      - THEME=storefront
      - MP_CUSTOM_DOMAIN=https://${HOMOLOG_PREFIX:-mp}-mlu.${HOMOLOG_BASE_DOMAIN:-ppolimpo.io}
    volumes:
      - wp-mlu-data:/var/www/html
      - db-mlu-data:/var/lib/mysql
      - ./woocommerce-mercadopago:/woocommerce-mercadopago

  wp-mpe:
    <<: *wp
    container_name: wp-mpe
    profiles: ["mpe"]
    environment:
      - SITE=mpe
      - PORT=80
      - THEME=storefront
      - MP_CUSTOM_DOMAIN=https://${HOMOLOG_PREFIX:-mp}-mpe.${HOMOLOG_BASE_DOMAIN:-ppolimpo.io}
    volumes:
      - wp-mpe-data:/var/www/html
      - db-mpe-data:/var/lib/mysql
      - ./woocommerce-mercadopago:/woocommerce-mercadopago

networks:
  web:

volumes:
  caddy_data:
  caddy_config:
  wp-mlb-data:
  db-mlb-data:
  wp-mla-data:
  db-mla-data:
  wp-mlm-data:
  db-mlm-data:
  wp-mco-data:
  db-mco-data:
  wp-mlc-data:
  db-mlc-data:
  wp-mlu-data:
  db-mlu-data:
  wp-mpe-data:
  db-mpe-data:
