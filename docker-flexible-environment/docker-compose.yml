# ============================================================================
# docker compose up                       → MLB store, PHP 7.4
# SITE=mla docker compose up              → MLA store, PHP 7.4
# SITE=mlb PHP_VERSION=8.4 docker compose up → MLB store, PHP 8.4
# ============================================================================

services:
  wordpress:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        PHP_VERSION: ${PHP_VERSION:-7.4}
        WORDPRESS_VERSION: ${WORDPRESS_VERSION:-latest}
    container_name: mp-wc-dev
    ports:
      - "${PORT:-8080}:80"
    environment:
      - SITE=${SITE:-mlb}
      - PORT=${PORT:-8080}
      - MP_PUBLIC_KEY_TEST=${MP_PUBLIC_KEY_TEST:-}
      - MP_ACCESS_TOKEN_TEST=${MP_ACCESS_TOKEN_TEST:-}
      - MP_PUBLIC_KEY_PROD=${MP_PUBLIC_KEY_PROD:-}
      - MP_ACCESS_TOKEN_PROD=${MP_ACCESS_TOKEN_PROD:-}
      - MP_CUSTOM_DOMAIN=${MP_CUSTOM_DOMAIN:-}
      - THEME=${THEME:-storefront}
      - MP_AUTOMATIC_PAYMENTS_BASE_PATH=${MP_AUTOMATIC_PAYMENTS_BASE_PATH:-}
      - MP_MODE=${MP_MODE:-test}
      - CHECKOUT_MODE=${CHECKOUT_MODE:-blocks}
      - CREATE_ORDER_PAY_TEST_DATA=${CREATE_ORDER_PAY_TEST_DATA:-false}
      - TEST_CUSTOMER_USERNAME=${TEST_CUSTOMER_USERNAME:-}
      - TEST_CUSTOMER_EMAIL=${TEST_CUSTOMER_EMAIL:-}
      - TEST_CUSTOMER_PASSWORD=${TEST_CUSTOMER_PASSWORD:-}
    # Chromium headless (Playwright E2E) needs more shared memory than Docker's default 64MB.
    # 2GB is the Playwright-recommended setting for Docker containers.
    shm_size: '2gb'
    volumes:
      - wp-data:/var/www/html
      - db-data:/var/lib/mysql
      - ..:/woocommerce-mercadopago

  ios-https:
    image: caddy:2.11.4-alpine@sha256:5f5c8640aae01df9654968d946d8f1a56c497f1dd5c5cda4cf95ab7c14d58648
    container_name: mp-wc-ios-https
    profiles: ["ios"]
    ports:
      - "127.0.0.1:${IOS_HTTPS_PORT:-8443}:8443"
    volumes:
      - ./Caddyfile.ios:/etc/caddy/Caddyfile:ro
      - ios-caddy-data:/data
      - ios-caddy-config:/config
    depends_on:
      - wordpress

volumes:
  wp-data:
  db-data:
  ios-caddy-data:
  ios-caddy-config:
